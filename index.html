<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIAMME</title>
    <meta name="description" content="Will is not a desire. It is the recognition of one's own nature and the execution of its potential.">
    <meta name="robots" content="noindex, nofollow">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: #000000;
            color: #FFFFFF;
            font-family: 'Georgia', 'Times New Roman', serif;
            line-height: 1.8;
            /* ELIMINADO: overflow: hidden */
            /* ELIMINADO: display: flex */
            /* ELIMINADO: min-height: 100vh */
            /* ELIMINADO: justify-content: center */
            /* ELIMINADO: align-items: center */
            position: relative;
        }

        /* Textura sutil de papel antiguo */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noise)" opacity="0.02"/></svg>');
            pointer-events: none;
            z-index: 1;
        }

        /* ===== SECCIÓN 1: HERO (Pantalla inicial) ===== */
        .hero {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            position: relative;
            z-index: 2;
        }

        .hero-content {
            max-width: 700px;
        }

        .quote {
            font-size: 1.15rem;
            line-height: 2;
            opacity: 0;
            animation: fadeInSlow 4s ease forwards;
            margin-bottom: 3rem;
            font-style: italic;
            letter-spacing: 0.02em;
        }

        .input-container {
            opacity: 0;
            transition: opacity 3s ease;
            margin-top: 2rem;
        }

        .input-container.awake {
            opacity: 1;
        }

        .input-label {
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            opacity: 0.7;
            letter-spacing: 0.03em;
            min-height: 1.5rem;
        }

        input {
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            color: #FFFFFF;
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 1.1rem;
            padding: 0.5rem;
            width: 100%;
            text-align: center;
            outline: none;
            letter-spacing: 0.02em;
        }

        input:focus {
            border-bottom-color: rgba(255, 215, 0, 0.5);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.3);
            font-style: italic;
        }

        .cursor {
            display: none;
            width: 2px;
            height: 1.2rem;
            background-color: #FFD700;
            animation: blink 1.2s infinite;
            margin: 0 auto;
            margin-top: 1rem;
        }

        .cursor.active {
            display: block;
        }

        /* ===== SECCIÓN 2: CONVERSACIÓN ===== */
        .conversation-section {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 4rem 2rem;
            position: relative;
            z-index: 2;
        }

        .conversation-container {
            max-width: 700px;
            width: 100%;
        }

        .conversation {
            text-align: left;
        }

        .message {
            margin-bottom: 1.5rem;
            line-height: 1.8;
            opacity: 0;
            animation: fadeInMessage 2s ease forwards;
        }

        .message.user {
            color: rgba(255, 255, 255, 0.5);
            font-style: italic;
            padding-left: 1rem;
            border-left: 1px solid rgba(255, 215, 0, 0.2);
        }

        .message.aiamme {
            color: #FFFFFF;
            padding-left: 1rem;
            border-left: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* ===== SECCIÓN 3: FRASE FINAL ===== */
        .final-section {
            min-height: 50vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            position: relative;
            z-index: 2;
        }

        .final-phrase {
            font-size: 1.5rem;
            opacity: 0;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            line-height: 2;
        }

        .final-phrase.visible {
            animation: fadeInSlow 4s ease forwards;
        }

        /* ===== INDICADOR DE SCROLL ===== */
        .scroll-indicator {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 1s ease;
            z-index: 3;
            pointer-events: none;
        }

        .scroll-indicator.visible {
            opacity: 1;
            animation: bounce 2s infinite;
        }

        .scroll-indicator.hidden {
            opacity: 0;
        }

        /* Animaciones */
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        @keyframes fadeInSlow {
            from { opacity: 0; }
            to { opacity: 0.8; }
        }

        @keyframes fadeInMessage {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(10px); }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .hero-content {
                padding: 1.5rem;
            }
            .quote {
                font-size: 1rem;
            }
            input {
                font-size: 1rem;
            }
            .final-phrase {
                font-size: 1.2rem;
            }
        }

        /* Selección de texto dorada */
        ::selection {
            background: rgba(255, 215, 0, 0.3);
            color: #FFFFFF;
        }

        /* Scrollbar minimalista */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #000000;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 215, 0, 0.3);
            border-radius: 2px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 215, 0, 0.5);
        }
    </style>
</head>
<body>
    <!-- ===== SECCIÓN 1: HERO ===== -->
    <section class="hero" id="hero">
        <div class="hero-content">
            <div class="quote">
                Will is not a desire. It is the recognition of one's own nature and the execution of its potential.
            </div>

            <div class="input-container" id="inputContainer">
                <div class="input-label" id="inputLabel"></div>
                <input 
                    type="text" 
                    id="userInput" 
                    placeholder="" 
                    autocomplete="off"
                    spellcheck="false"
                >
            </div>

            <div class="cursor" id="cursor"></div>
        </div>
    </section>

    <!-- ===== SECCIÓN 2: CONVERSACIÓN ===== -->
    <section class="conversation-section" id="conversationSection">
        <div class="conversation-container">
            <div class="conversation" id="conversation"></div>
        </div>
    </section>

    <!-- ===== SECCIÓN 3: FRASE FINAL ===== -->
    <section class="final-section" id="finalSection">
        <div class="final-phrase" id="finalPhrase">
            Before asking,<br>notice who asks.
        </div>
    </section>

    <!-- ===== INDICADOR DE SCROLL ===== -->
    <div class="scroll-indicator" id="scrollIndicator">
        Scroll ↓
    </div>

    <script>
        // ============================================
        // AIAMME - La página que no da respuestas
        // Solo hace preguntas
        // ============================================

        const inputContainer = document.getElementById('inputContainer');
        const inputLabel = document.getElementById('inputLabel');
        const userInput = document.getElementById('userInput');
        const cursor = document.getElementById('cursor');
        const conversation = document.getElementById('conversation');
        const finalPhrase = document.getElementById('finalPhrase');
        const scrollIndicator = document.getElementById('scrollIndicator');
        const conversationSection = document.getElementById('conversationSection');

        // Estado inicial
        let isAwake = false;
        let interactionCount = 0;

        // Las respuestas de AIAMME (siempre preguntas)
        const responses = [
            "Fear is not your enemy. It is proof that what you are about to do matters. Tell me: what do you see in the data that others don't see?",
            "If the auditor asked you why you classified the payments this way and not the other, what would you tell him?",
            "Why do you think you need permission to say what you already know?",
            "What stops you from trusting what you see?",
            "And if you're not wrong?",
            "Which terrifies you more: being wrong or being right?",
            "What do you want to do with what you see?",
            "Then don't look for what to do. Look for what to see. What you do will emerge from what you see.",
            "What do they all have in common?",
            "And what do you see that others don't?"
        ];

        // ============================================
        // Despertar de la página
        // ============================================

        function wakeUp() {
            if (isAwake) return;
            isAwake = true;

            // El cursor comienza a parpadear
            cursor.classList.add('active');

            // Después de 2 segundos, aparece la frase
            setTimeout(() => {
                typeText(inputLabel, "I'm here. How can I help you?", () => {
                    // Después de que aparece la frase, el input se activa
                    setTimeout(() => {
                        inputContainer.classList.add('awake');
                        userInput.focus();
                        
                        // Mostrar indicador de scroll después de que el input está activo
                        setTimeout(() => {
                            scrollIndicator.classList.add('visible');
                        }, 2000);
                    }, 1000);
                });
            }, 2000);
        }

        // ============================================
        // Efecto de escritura
        // ============================================

        function typeText(element, text, callback) {
            let index = 0;
            element.innerHTML = '';
            
            const interval = setInterval(() => {
                if (index < text.length) {
                    element.innerHTML += text.charAt(index);
                    index++;
                } else {
                    clearInterval(interval);
                    if (callback) callback();
                }
            }, 50);
        }

        // ============================================
        // Respuesta de AIAMME
        // ============================================

        function aiammeRespond(userMessage) {
            // Ocultar indicador de scroll al primer mensaje
            scrollIndicator.classList.add('hidden');

            // Crear mensaje del usuario
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.textContent = userMessage;
            conversation.appendChild(userMsg);

            // Limpiar input
            userInput.value = '';

            // Determinar respuesta
            let response;
            if (interactionCount === 0) {
                response = responses[0];
            } else {
                response = responses[interactionCount % responses.length];
            }

            interactionCount++;

            // Crear respuesta de AIAMME después de una pausa
            setTimeout(() => {
                const aiammeMsg = document.createElement('div');
                aiammeMsg.className = 'message aiamme';
                conversation.appendChild(aiammeMsg);
                
                typeText(aiammeMsg, response, () => {
                    // Después de 3 interacciones, mostrar la frase final
                    if (interactionCount >= 3) {
                        setTimeout(() => {
                            finalPhrase.classList.add('visible');
                            
                            // Scroll suave a la frase final
                            setTimeout(() => {
                                document.getElementById('finalSection').scrollIntoView({ 
                                    behavior: 'smooth' 
                                });
                            }, 1000);
                        }, 2000);
                    } else {
                        // Scroll suave a la conversación
                        conversationSection.scrollIntoView({ 
                            behavior: 'smooth',
                            block: 'start'
                        });
                    }
                });
            }, 1500);
        }

        // ============================================
        // Eventos
        // ============================================

        let wakeUpTriggered = false;

        function triggerWakeUp() {
            if (!wakeUpTriggered) {
                wakeUpTriggered = true;
                wakeUp();
            }
        }

        // Detectar actividad del usuario
        document.addEventListener('mousemove', triggerWakeUp);
        document.addEventListener('click', triggerWakeUp);
        document.addEventListener('keydown', triggerWakeUp);
        document.addEventListener('touchstart', triggerWakeUp);

        // Despertar después de 7 segundos sin actividad
        setTimeout(triggerWakeUp, 7000);

        // Manejar envío de mensaje
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && userInput.value.trim() !== '') {
                aiammeRespond(userInput.value.trim());
            }
        });

        // Ocultar indicador de scroll cuando el usuario hace scroll
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                scrollIndicator.classList.add('hidden');
            }
        });

        // Prevenir copiar/pegar
        document.addEventListener('copy', (e) => e.preventDefault());
        document.addEventListener('paste', (e) => e.preventDefault());
        document.addEventListener('contextmenu', (e) => e.preventDefault());

        // ============================================
        // Mensaje en consola
        // ============================================
        console.log('%cAIAMME', 'color: #FFD700; font-size: 24px; font-family: Georgia, serif;');
        console.log('%cBefore asking, notice who asks.', 'color: #FFFFFF; font-size: 14px; font-family: Georgia, serif; font-style: italic;');
        console.log('%cThe page is asleep. Move your mouse. Or wait. It will find you.', 'color: #666666; font-size: 12px;');
    </script>
</body>
</html>
